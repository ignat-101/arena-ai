[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-premium-funpay-automation"
version = "2.0.0"
description = "Полная автоматизация покупки подписки X.com Premium для клиентов FunPay с авто-оплатой в сети Base, AI-поддержкой через OpenRouter и Web-дашбордом"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "qrcode>=7.4.2",
    "pillow>=10.2.0",
    "colorlog>=6.8.0",
    "web3>=6.15.0",
    "eth-account>=0.11.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
]

[project.scripts]
x-premium-bot = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
